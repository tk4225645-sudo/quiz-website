<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geography Quiz - Test Your Knowledge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="quiz-header">
      <h1>🌍 Geography Quiz</h1>
      <p>Test your knowledge about Earth and coordinates</p>
    </div>

    <div class="quiz-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="quiz-content">
        <div class="question-section">
          <span class="question-number" id="questionNumber">Question 1 of 3</span>
          <h2 class="question-text" id="questionText"></h2>
        </div>

        <div class="options-section" id="options"></div>

        <div class="feedback" id="feedback"></div>

        <div class="quiz-footer">
          <div class="score-display" id="score">Score: 0</div>
          <button class="next-button" id="nextButton" onclick="nextQuestion()">
            Next Question →
          </button>
        </div>
      </div>

      <div class="results-container" id="resultsContainer" style="display: none;">
        <div class="results-content">
          <h2 id="finalScore"></h2>
          <p id="resultMessage"></p>
          <div class="result-details" id="resultDetails"></div>
          <button class="restart-button" onclick="restartQuiz()">
            🔄 Restart Quiz
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
